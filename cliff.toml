[changelog]
header = """
# Changelog

All notable changes to this project are documented here. Generated by
[git-cliff](https://github.com/orhun/git-cliff) from conventional commit
messages; reachable from `CHANGELOG.md` below.
"""
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {{ commit.message | upper_first }}
{%- if commit.breaking %} (breaking) {% endif %} [\`{{ commit.id | truncate(7) }}\`](https://github.com/4ld4z4b4l/dc-podman-volume-bootstrap/commit/{{ commit.id }})
{%- endfor %}
{% endfor %}
"""
footer = """
<!-- generated by git-cliff -->
"""

[git]
conventional_commits = true
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^docs", group = "Documentation" },
  { message = "^refactor", group = "Refactor" },
  { message = "^perf", group = "Performance" },
  { message = "^test", group = "Tests" },
  { message = "^build", group = "Build" },
  { message = "^ci", group = "CI" },
  { message = "^chore", group = "Chores" },
  { message = "^agents", group = "Agents" },
  { message = "^seed", group = "Scaffolding" },
  { body = ".*breaking.*", group = "Breaking" },
]
filter_commits = false
sort_commits = "newest"